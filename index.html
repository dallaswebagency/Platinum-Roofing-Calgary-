y are punctual, tidy and their contractors are hard-working and clean-mouthed."},{name:"Julie Berdin",text:"Mark and his team were professional and paid attention to all the details. They installed a TPO membrane over an existing metal roof system and I'm confident it's going to perform great. Straight forward and do what they say they are going to do."},{name:"John M",text:"This spring I had three commercial roofs that needed replacement. From start to finish, I found Platinum Roofing to be professional, timely, clean and respectful to my tenants. Even to go as far as notifying when noise levels would be excessive."},{name:"Kelvin Choy",text:"I have used Platinum Roofing for my flat roofs for the last 9 years. They are competitive and workmanship is top notch. They are professional right from the management to the crews onsite. Highly recommended!!"},{name:"Bruce Marshall",text:"These guys quickly and efficiently sorted out a large leak in my roof. Completely professional throughout, came on short notice and the price was very fair. Good work."},{name:"Cody Carnahan",text:"Platinum Roofing came in on short notice for a TPO install on a Tim Hortons restaurant. Mark and his workers did an exceptional job, very professional in workmanship and in a timely manner."},{name:"Sandra Annie",text:"We looked at 4 other commercial roofing companies and chose Platinum not only for a fair price but I was able to have an independent roofing inspector of my choice inspect the roof during and after the work. Best part was Platinum paid for the roofing inspector."},{name:"CAL-ALTA MANAGEMENT LTD.",text:"We are pleased with the workmanship and prompt completion along with the fair pricing for their work. The owner Mark is a stand-up guy, knowledgeable, and very easy to work with. I can vouch for Platinum Roofing."},{name:"Graham Fitzsimmons",text:"Platinum Roofing were there in our time of need. Excellent service when we had an emergency, very reliable and professional. The staff are very easy to deal with and very knowledgeable of our needs!"},{name:"B Dhillon",text:"Very professional and courteous! Got the job done in the most fast, safe and efficient manner. Highly recommended for commercial roof work."},{name:"Arpad",text:"I have worked with Mark and Platinum Roofing for over 7 yrs now on a few commercial buildings. I prefer an SBS or torch down roof as it seems to last the longest in Alberta's crazy weather. Platinum Roofing is very professional and knowledgeable about all commercial roof applications."},{name:"M Family",text:"Platinum Roofing replaced our old tar and gravel flat roof with new SBS roof above our office last year. We are very pleased with the workmanship and speed of install. I highly recommend Platinum Roofing as they truly are Calgary's Flat Roof Specialists."},{name:"Elizabeth Allan",text:"I had requested a roof inspection on my flat roof. Platinum's response was very quick. Their technician Stefan was professional, courteous and knowledgeable. I would definitely recommend this company."},{name:"Victoria Woodward",text:"Mark and his crew were professional and worked around our schedule. They did a great job and cleaned up every day. The metal work was great."},{name:"Clem Walisser",text:"Platinum Roofing repaired it for me a few years ago, did a great job but the other parts are starting to fail and it's time to replace the whole thing. I called and was re-quoted a price in 2 days. I will be moving ahead with a complete replacement with TPO membrane."},{name:"Joanne Gau",text:"The entire experience with Platinum Roofing was easy and stress free. Mark explained that his price included all the extras the other guy was trying to add in. The job went very smoothly. All our tenants had good things to say about Platinum or didn't even notice that Platinum was there."}],lc=[{name:"SOPREMA",kind:"Manufacturer"},{name:"IKO",kind:"Manufacturer"},{name:"Holcim Elevate",kind:"Manufacturer"},{name:"Carlisle",kind:"Manufacturer"},{name:"Calgary Construction Association",kind:"Long-time member"},{name:"Calgary Safety Association",kind:"Association"}],nc=[{q:"Do you do both residential and commercial roofing?",a:"Yes. Platinum Roofing specializes in Commercial Roofing, Flat Roofing, Low Sloped Roofing and Residential Roofing, with over 30 years of roofing experience."},{q:"Which flat roof membrane is right for my building?",a:"It depends on your building. We install SBS, EPDM and TPO (plus BUR), and with our experience and knowledge we help you choose the correct membrane type for your flat or low-sloped roof."},{q:"What's the difference between SBS, EPDM and TPO?",a:"SBS is a 2-ply modified bitumen system torch or asphalt bonded into a monolithic waterproof membrane. EPDM is a durable synthetic rubber membrane with taped or glued seams. TPO is a flame retardant, UV resistant thermoplastic with hot-air welded seams that can go over existing BUR or metal roofs."},{q:"What warranty comes with your work?",a:"We provide 2 to 15 years of workmanship warranty to all our clients depending on the work. Commercial flat roofing comes with a written 10 year warranty; residential shingle roofs include a full coverage 10 yr workmanship warranty plus the manufacturer's limited lifetime warranty. EPDM roofing is available with up to 30 years warranty."},{q:"Is the roof inspection free?",a:"Yes. Call Calgary's Flat Roof Specialists for your free inspection. Our experienced inspector can assess your roof and build a cost effective action plan, including preventative maintenance."},{q:"Can you help with a hail or wind damage insurance claim?",a:"Yes. Call us first for a free onsite roof inspection and we'll provide a certified roof report with pictures and a free estimate to supply your insurance adjuster and get your claim started."},{q:"Should I repair or replace my roof?",a:"We provide both cost effective roof repair and roof replacement solutions. After a free inspection we'll explain the options so you can cho
